# The machines Ansible manages.
#
# On the local platform that is only this PC: Ansible configures Nexus through
# its API from here. Real servers - the Dell later, or a cloud again - get their
# groups added here (git tag vultr-cloud shows the cloud layout).
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
