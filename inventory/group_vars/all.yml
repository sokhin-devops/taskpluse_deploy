---
# The named admin account every playbook logs in as. It has no password - only
# the SSH key below - and passwordless sudo, which is what lets Ansible run
# unattended. playbooks/bootstrap.yml creates it on fresh VMs (connecting as
# root once); setup-server.yml then switches root login off.
admin_user: deploy
ansible_user: "{{ admin_user }}"

# The passphrase-protected key made for these servers. Load it once per shell with
# `source scripts/session.sh` so Ansible doesn't stop to ask for the passphrase.
ansible_ssh_private_key_file: ~/.ssh/taskpluse_vultr
admin_ssh_public_key_file: ~/.ssh/taskpluse_vultr.pub

# The Vultr private network. Must match vultr_vpc_subnet / vultr_vpc_subnet_mask
# in playbooks/vars/infrastructure.yml. Every server trusts traffic from it.
private_network_cidr: 10.20.0.0/24
