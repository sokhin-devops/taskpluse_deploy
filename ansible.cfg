[defaults]
# The machines and their groups. The Vultr cloud version discovered them through
# the Vultr API (git tag vultr-cloud). For real servers again (e.g. the Dell),
# list them in this file. The local kind platform doesn't use Ansible inventory.
inventory = inventory/hosts.yml
# Roles live at the repo root, not next to the playbooks, which is where
# Ansible would otherwise look for them.
roles_path = roles
# Checked, not skipped: see StrictHostKeyChecking below for how a brand-new
# server is still reachable on the first run.
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default

[inventory]
# Only the parsers this repo uses. Files on /mnt/d look executable to WSL, so the
# default 'script' parser would try to run the inventory file as a program.
enable_plugins = yaml, host_list
# A broken inventory (bad API key, network down) stops the run instead of
# continuing with no hosts and reporting "skipping: no hosts matched".
unparsed_is_failed = True

[ssh_connection]
# accept-new trusts a server the first time it is seen and refuses to connect if
# its key ever changes afterwards. That is the protection host_key_checking =
# False used to switch off. The first three options are Ansible's own defaults;
# setting ssh_args replaces them, so they have to be repeated here.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
