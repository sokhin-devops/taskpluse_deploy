---
# Ansible owns the host - kernel settings, config files, delivering the stack
# definition. Compose owns the container stack itself.
- name: Deploy the ELK logging stack
  hosts: production
  become: true

  vars:
    elk_network: elk-network
    compose_dir: /opt/taskpluse-elk
    log_retention_days: 14

  tasks:

    # Elasticsearch runs a bootstrap check on this and refuses to start if it
    # is too low. The file makes it survive a reboot; the command applies it now.
    - name: Persist vm.max_map_count for Elasticsearch
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-elasticsearch.conf
        content: "vm.max_map_count=262144\n"
        mode: "0644"
      register: sysctl_file

    - name: Apply vm.max_map_count immediately
      ansible.builtin.command: sysctl -w vm.max_map_count=262144
      when: sysctl_file.changed
      changed_when: true

    # Declared external in docker-compose.yml, so it has to exist first.
    - name: Create the ELK docker network
      community.docker.docker_network:
        name: "{{ elk_network }}"
        state: present

    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/logstash/pipeline
        - /etc/filebeat
        - "{{ compose_dir }}"

    - name: Copy the Logstash pipeline
      ansible.builtin.copy:
        src: ../files/logstash/logstash.conf
        dest: /etc/logstash/pipeline/logstash.conf
        mode: "0644"
      notify: Restart logstash

    # Filebeat refuses to start if this file is group- or world-writable.
    - name: Copy the Filebeat config
      ansible.builtin.copy:
        src: ../files/filebeat/filebeat.yml
        dest: /etc/filebeat/filebeat.yml
        mode: "0644"
        owner: root
        group: root
      notify: Restart filebeat

    - name: Copy the compose stack definition
      ansible.builtin.copy:
        src: "../files/elk/{{ item }}"
        dest: "{{ compose_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - docker-compose.yml
        - .env

    - name: Bring up the ELK stack
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: present

    - name: Wait for Elasticsearch to answer
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/_cluster/health
        status_code: 200
      register: es_health
      retries: 30
      delay: 5
      until: es_health.status == 200

    - name: Install the log retention policy
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/_ilm/policy/taskpluse-logs-policy
        method: PUT
        body_format: json
        body:
          policy:
            phases:
              hot:
                actions: {}
              delete:
                min_age: "{{ log_retention_days }}d"
                actions:
                  delete: {}
        status_code: 200

    # priority 200 beats the default template Logstash installs.
    - name: Install the index template
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/_index_template/taskpluse-logs-template
        method: PUT
        body_format: json
        body:
          index_patterns:
            - "taskpluse-*"
          priority: 200
          template:
            settings:
              index.lifecycle.name: taskpluse-logs-policy
              number_of_replicas: 0
        status_code: 200

    - name: Wait for Kibana to be ready
      ansible.builtin.uri:
        url: http://127.0.0.1:5601/api/status
        status_code: 200
      register: kibana_status
      retries: 30
      delay: 10
      until: kibana_status.status == 200

    # `filename` is resolved on the Ansible controller, not the target host, so
    # this points at the repo copy rather than a path on the VM.
    #
    # The import API cannot distinguish "created" from "overwrote with identical
    # content", so it would report changed on every run. Reporting false keeps
    # `changed=0` meaningful as a drift signal for the rest of the playbook.
    - name: Import the Kibana saved objects
      ansible.builtin.uri:
        url: "http://127.0.0.1:5601/api/saved_objects/_import?overwrite=true"
        method: POST
        headers:
          kbn-xsrf: "true"
        body_format: form-multipart
        body:
          file:
            filename: "{{ playbook_dir }}/../files/kibana/kibana-saved-objects.ndjson"
            mime_type: application/ndjson
        status_code: 200
      register: kibana_import
      changed_when: false

    - name: Show what was imported
      ansible.builtin.debug:
        msg: "Imported {{ kibana_import.json.successCount }} Kibana saved objects (success: {{ kibana_import.json.success }})"

  handlers:
    - name: Restart logstash
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: restarted
        services:
          - logstash

    - name: Restart filebeat
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: restarted
        services:
          - filebeat
