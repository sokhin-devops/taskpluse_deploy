---
- name: Deploy TaskPluse API (blue-green)
  hosts: production
  become: true

  vars:
    image: "registry.sokhin.site/docker-hosted/taskpluse-api:{{ image_tag }}"

  # Sets active_color / active_port and other_color / other_port.
  roles:
    - blue_green

  tasks:

    - name: Pull Docker image
      community.docker.docker_image:
        name: "{{ image }}"
        source: pull

    - name: Remove any stale container in the idle slot
      community.docker.docker_container:
        name: "{{ container_prefix }}-{{ other_color }}"
        state: absent

    # The live colour is never touched, so it keeps serving every request while
    # the new version starts and is checked.
    - name: Start new container in the idle slot
      community.docker.docker_container:
        name: "{{ container_prefix }}-{{ other_color }}"
        image: "{{ image }}"
        state: started
        restart_policy: unless-stopped
        env_file: /root/taskpluse-api.env
        networks:
          - name: taskpluse-network
        published_ports:
          - "127.0.0.1:{{ other_port }}:8082"

    - name: Wait for idle container to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ other_port }}"
        delay: 5
        timeout: 60

    # An open port is not a ready app - Spring Boot binds before the context has
    # finished loading, so this retries rather than trusting wait_for alone.
    - name: Health-check the idle container before it takes real traffic
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ other_port }}/actuator/health"
        status_code: 200
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200

    - name: Switch traffic to the new container
      ansible.builtin.include_role:
        name: blue_green
        tasks_from: switch
      vars:
        switch_to_color: "{{ other_color }}"
        switch_to_port: "{{ other_port }}"

    - name: Show health status
      ansible.builtin.debug:
        msg: "TaskPluse API ({{ other_color }}, port {{ other_port }}) is live and healthy: {{ health_check.json }}"
