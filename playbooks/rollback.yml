---
- name: Roll back TaskPluse API to the other colour
  hosts: production
  become: true

  # Sets active_color / active_port and other_color / other_port.
  roles:
    - blue_green

  tasks:

    - name: Inspect the rollback target container
      community.docker.docker_container_info:
        name: "{{ container_prefix }}-{{ other_color }}"
      register: target_container

    # Switching traffic onto a dead container turns a bad deploy into an outage,
    # so this fails before anything touches nginx.
    - name: Fail early if there is nothing to roll back to
      ansible.builtin.assert:
        that:
          - target_container.exists
          - target_container.container.State.Running
        fail_msg: "Cannot roll back: container {{ container_prefix }}-{{ other_color }} is missing or not running."

    # Fewer retries than a deploy: the rollback target has been running for a
    # while and is warm. If it isn't answering in 9 seconds it isn't viable.
    - name: Health-check the rollback target before switching
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ other_port }}/actuator/health"
        status_code: 200
      register: health_check
      retries: 3
      delay: 3
      until: health_check.status == 200

    - name: Switch traffic to the rollback target
      ansible.builtin.include_role:
        name: blue_green
        tasks_from: switch
      vars:
        switch_to_color: "{{ other_color }}"
        switch_to_port: "{{ other_port }}"

    - name: Show rollback result
      ansible.builtin.debug:
        msg: >-
          Rolled back from {{ active_color }} to {{ other_color }}
          (port {{ other_port }}), now serving image
          {{ target_container.container.Config.Image }}
