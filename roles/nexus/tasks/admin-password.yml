---
# Nexus on a server: the one-time admin password from first start is a file in
# the data directory on the host. (On the local platform, playbooks/
# setup-local-registry.yml reads it from inside the container instead.)

- name: Look for the one-time admin password from first start
  ansible.builtin.stat:
    path: "{{ nexus_data_dir }}/admin.password"
  register: nexus_initial_password_file

- name: Replace the generated admin password with the vault's
  when: nexus_initial_password_file.stat.exists
  block:
    - name: Read the generated admin password
      ansible.builtin.slurp:
        src: "{{ nexus_data_dir }}/admin.password"
      register: nexus_initial_password
      no_log: true

    - name: Set the admin password from the vault
      ansible.builtin.uri:
        url: "{{ nexus_api }}/security/users/admin/change-password"
        method: PUT
        user: admin
        password: "{{ nexus_initial_password.content | b64decode | trim }}"
        force_basic_auth: true
        headers:
          Content-Type: text/plain
        body: "{{ nexus_admin_password }}"
        status_code: 204
      no_log: true
      changed_when: true

    # Its job is done. Left behind it would look like a valid admin password.
    - name: Delete the generated admin password file
      ansible.builtin.file:
        path: "{{ nexus_data_dir }}/admin.password"
        state: absent
