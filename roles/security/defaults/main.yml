---
# Two firewall layers, each enough on its own:
#   network firewall - in front of the machines: the cloud firewall (Vultr, tag
#                      vultr-cloud) or, in the home lab, the router and VM host,
#                      which forward nothing from the internet
#   UFW (here)       - on each machine, decides which ports exist at all
# SSH is open to "anywhere" at the UFW layer on purpose: the network layer
# already decides who can reach it, and pinning UFW to one IP as well would lock
# you out the day that IP changes - with the SSH access needed to fix it gone.
ufw_allowed_tcp_ports: [22]

# Extra public ports per server group - see inventory/group_vars/<group>.yml.
ufw_extra_tcp_ports: []

# Sources trusted on every port. Kubernetes nodes add the pod network.
ufw_trusted_networks:
  - { cidr: "{{ private_network_cidr }}", comment: taskpluse private network }

# Ordinary servers don't forward traffic. Kubernetes nodes override this to allow.
ufw_routed_policy: deny

# No fail2ban: it bans IPs that keep failing SSH logins, but SSH is never exposed
# to the internet (cloud firewall or home router in front), so there is nothing
# for it to see.
