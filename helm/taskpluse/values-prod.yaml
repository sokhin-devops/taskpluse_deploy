# Production: two of each, spread over both workers, so a rolling update or a
# lost node never takes the app down. No Swagger.
api:
  replicas: 2
  config:
    SPRINGDOC_ENABLED: "false"
    DB_POOL_SIZE: "10"
    APP_CORS_ALLOWED_ORIGINS: "https://taskpluse.sokhin.site,http://taskpluse.localhost"
web:
  replicas: 2
database:
  name: taskpluse_prod
ingress:
  hosts:
    - taskpluse.localhost
    - taskpluse.sokhin.site
