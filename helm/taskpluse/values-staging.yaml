# Staging: one of each, Swagger reachable for testing the API by hand.
api:
  replicas: 1
  config:
    SPRINGDOC_ENABLED: "true"
    DB_POOL_SIZE: "10"
    # The addresses the browser uses. Same-origin needs no CORS, but the API's
    # built-in default is an old hostname - keep the list true.
    APP_CORS_ALLOWED_ORIGINS: "https://taskpluse-staging.sokhin.site,http://taskpluse-staging.localhost"
web:
  replicas: 1
database:
  name: taskpluse_staging
ingress:
  # *.localhost always means this PC, in browsers and curl. The .sokhin.site
  # name is public, through the Cloudflare Tunnel (cluster/cloudflared/).
  hosts:
    - taskpluse-staging.localhost
    - taskpluse-staging.sokhin.site
  extraApiPaths:
    - /swagger-ui
    - /v3/api-docs
