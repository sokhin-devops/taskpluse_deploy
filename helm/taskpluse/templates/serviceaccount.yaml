# The identity the Pods run as. TaskPluse never calls the Kubernetes API, so no
# token is mounted into its Pods - one less credential to steal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taskpluse.fullname" . }}
  labels:
    {{- include "taskpluse.labels" (dict "root" . "component" "app" "version" .Values.api.image.tag) | nindent 4 }}
automountServiceAccountToken: false
