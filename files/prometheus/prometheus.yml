global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['127.0.0.1:8080']

  # Both colours are scraped so the new version can be compared against the old
  # during a deploy. The idle one is expected to be up too.
  - job_name: 'taskpluse-api'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:8082']
        labels:
          color: blue
      - targets: ['127.0.0.1:8083']
        labels:
          color: green
