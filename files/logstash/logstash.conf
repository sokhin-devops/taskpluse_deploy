input {
  beats {
    port => 5044
  }
}

filter {
  if [log_source] == "nginx-access" {
    grok {
      match => { "message" => "%{IPORHOST:client_ip} - %{DATA:remote_user} \[%{HTTPDATE:nginx_timestamp}\] \"%{WORD:http_method} %{DATA:request_path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code:int} %{NUMBER:body_bytes:int} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"" }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }
  } else if [log_source] != "nginx-error" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+%{NUMBER:pid}\s+---\s+\[%{DATA:app_name}\]\s+\[\s*%{DATA:thread}\s*\]\s+%{DATA:logger}\s+:\s+%{GREEDYDATA:log_message}" }
      tag_on_failure => ["_grokparsefailure"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "taskpluse-%{+YYYY.MM.dd}"
  }
}
