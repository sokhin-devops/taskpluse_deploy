# Cloudflare Tunnel: the only way in from the internet. cloudflared opens an
# OUTBOUND connection to Cloudflare; visitors' requests come back through it.
# No router port is opened and the home IP is never exposed. Cloudflare serves
# HTTPS with its own certificate (renewed automatically).
#
#   Browser --HTTPS--> Cloudflare --tunnel--> cloudflared (here) --> Traefik --> app
#
# Tunnel "taskpluse" was created once with `cloudflared tunnel create taskpluse`.
# Its credentials are a Secret created outside git:
#   kubectl -n cloudflared create secret generic tunnel-credentials \
#     --from-file=credentials.json=$HOME/.cloudflared/8114988e-45aa-42e0-aae3-63025dbb0adc.json
# Each public hostname also needs a DNS record:
#   cloudflared tunnel route dns taskpluse <hostname>
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: 8114988e-45aa-42e0-aae3-63025dbb0adc
    credentials-file: /etc/cloudflared/creds/credentials.json
    # /ready on this port is the health check used by the probes below.
    metrics: 0.0.0.0:2000
    # The image is upgraded by changing its tag here, not by itself.
    no-autoupdate: true
    # Which public hostname goes where. Everything is handed to Traefik, which
    # routes by hostname using the Ingresses; unknown names get a 404 here.
    ingress:
      - hostname: taskpluse-staging.sokhin.site
        service: http://traefik.traefik.svc.cluster.local:80
      - hostname: taskpluse.sokhin.site
        service: http://traefik.traefik.svc.cluster.local:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  # Two connectors on different nodes: the site stays up while one restarts.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.1
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yaml", "run"]
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared
        - name: creds
          secret:
            secretName: tunnel-credentials
